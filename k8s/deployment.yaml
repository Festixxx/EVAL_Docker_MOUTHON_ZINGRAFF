apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcade-api
  labels:
    app: arcade-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arcade-api
  template:
    metadata:
      labels:
        app: arcade-api
    spec:
      containers:
        - name: arcade-api
          image: arcade-leaderboard:latest
          imagePullPolicy: Never        # image chargée localement via kind/minikube
          ports:
            - containerPort: 8000
          env:
            - name: DB_PATH
              value: /data/scores.db
          volumeMounts:
            - name: scores-data
              mountPath: /data

          # Liveness : redémarre le pod si l'API ne répond plus
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          # Readiness : enlève le pod du trafic tant qu'il n'est pas prêt
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

      volumes:
        - name: scores-data
          emptyDir: {}   # Pour un vrai cluster : remplacer par un PersistentVolumeClaim
