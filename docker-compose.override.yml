# Mode DEV - appliqué automatiquement par "docker compose up"
services:
  api:
    build:
      context: .
      target: production
    environment:
      DB_PATH: /data/scores.db
      LOG_LEVEL: debug
    volumes:
      - ./app:/app/app:ro
      - scores_data:/data
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --log-level
      - debug
    restart: "no"
