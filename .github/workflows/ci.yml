name: CI – Retro Arcade Leaderboard

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:

  build-test:
    name: Build / Lint / Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app/

      - name: Tests (pytest)
        run: pytest -q --tb=short

  sast-bandit:
    name: SAST – Bandit
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -r app/ -ll -ii

  dep-audit:
    name: Audit dépendances – pip-audit
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  docker-scan:
    name: Docker Build + Trivy Scan
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image Docker
        run: docker build -t arcade-leaderboard:ci .

      - name: Scan Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "arcade-leaderboard:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
